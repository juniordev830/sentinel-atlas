name: Sentinel Atlas CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sentinel-atlas-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate inline browser JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("web/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b(?![^>]*\bsrc=)[^>]*>(.*?)</script>", html, re.I | re.S)
          if not scripts:
              raise SystemExit("No inline JavaScript found in web/index.html")
          Path("/tmp/sentinel-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/sentinel-inline.js

      - name: Testar controles do painel web
        run: node --test tests/sentinel-hud.test.cjs

      # Incremental, dependency-free coverage for the legacy data/ helpers.
      # Do not run data/*.test.mjs wholesale yet: some suites import external
      # packages (Cesium/satellite.js) and paths not present in this repo.
      - name: Test Node data helper contracts
        run: |
          node --test \
            data/aircraftMeta.test.mjs \
            data/trafficQueue.test.mjs \
            data/trafficFlowStyle.test.mjs \
            data/tapAddress.test.mjs \
            data/aircraftNearbyPolicy.test.mjs \
            data/adsbLolFallback.test.mjs \
            data/route-cap-truthfulness.test.mjs \
            data/firms-calendar-validity.test.mjs \
            data/cockpitAirLod.test.mjs \
            data/modelEligibility.test.mjs \
            data/detectionCohort.test.mjs

      # Inventory is informational: it does not claim unselected suites pass.
      # Fail only if an explicitly selected test was removed or renamed.
      - name: Inventory remaining Node data suites
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          ci = Path(".github/workflows/ci.yml").read_text(encoding="utf-8")
          selected = set(re.findall(r"data/[\w.-]+\.test\.mjs", ci))
          available = {p.as_posix() for p in Path("data").glob("*.test.mjs")}
          missing = sorted(selected - available)
          if missing:
              raise SystemExit("CI references missing test suites: " + ", ".join(missing))

          lines = [
              "### Node data test inventory",
              f"Selected in CI: **{len(selected)}**; discovered: **{len(available)}**; not selected: **{len(available - selected)}**.",
              "",
              "Static import triage only; candidates still need real execution before being enabled.",
              "",
              "| Not selected | Initial triage |",
              "| --- | --- |",
          ]
          for name in sorted(available - selected):
              source = Path(name).read_text(encoding="utf-8")
              imports = re.findall(r"""(?:\bfrom\s+|\bimport\s+)["']([^"']+)["']""", source)
              missing_local = sorted({
                  spec for spec in imports
                  if spec.startswith(".") and not (Path(name).parent / spec).exists()
              })
              external = sorted({
                  spec for spec in imports
                  if not spec.startswith(".") and not spec.startswith("node:")
              })
              if missing_local:
                  status = "Missing relative imports: " + ", ".join(missing_local)
              elif external:
                  status = "External imports: " + ", ".join(external)
              else:
                  status = "Candidate for execution (static imports only)"
              lines.append(f"| {name} | {status} |")
          report = "\n".join(lines) + "\n"
          print(report)
          if os.environ.get("GITHUB_STEP_SUMMARY"):
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
                  output.write(report)
          PY

      - name: Validate safe local-only Docker Compose contract
        env:
          SENTINEL_API_TOKEN: ci-test-token-not-real-012345678901234567890
        run: |
          docker compose config --quiet
          docker compose config --format json > /tmp/atlas-compose-config.json
          python - <<'PY'
          import json
          from pathlib import Path
          compose = json.loads(Path("/tmp/atlas-compose-config.json").read_text())
          service = compose["services"]["atlas"]
          assert service["environment"]["SENTINEL_ENV"] == "production"
          assert len(service["environment"]["SENTINEL_API_TOKEN"]) >= 32
          assert service["ports"] == [{
              "mode": "ingress", "target": 8000,
              "published": "8000", "protocol": "tcp", "host_ip": "127.0.0.1"
          }], service["ports"]
          assert "ALL" in service["cap_drop"]
          assert "no-new-privileges:true" in service["security_opt"]
          dockerfile = Path("Dockerfile").read_text()
          ignore = Path(".dockerignore").read_text().splitlines()
          assert "ENV SENTINEL_ENV=production" in dockerfile
          assert "USER atlas" in dockerfile
          assert ".env" in ignore and ".env.*" in ignore and ".data" in ignore
          PY

      - name: Validate Python syntax
        run: |
          python -m py_compile backend/app.py python/gps_core.py python/settings.py

      - name: Run test suite
        run: python -m pytest tests -q
